<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadence | Habit Tracker</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <script>
      (function () {
        try {
          // MUST match the exact Zustand localStorage key found in step 1
          const STORE_KEY = "cadence-storage";
          const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem("theme");
          if (!raw) return;

          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch {
            parsed = { theme: raw };
          }
          const state = parsed.state || parsed;

          // 1. Theme application
          if (
            state.theme === "dark" ||
            (!state.theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }

          // 2. Sidebar state application
          if (state && (state.isSidebarCollapsed || state.isCollapsed)) {
            document.documentElement.setAttribute("data-sidebar-collapsed", "true");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Inline critical override executed by browser parser immediately */
      html[data-sidebar-collapsed="true"] aside {
        width: 4rem !important;
      }
      html[data-sidebar-collapsed="true"] aside span,
      html[data-sidebar-collapsed="true"] aside p,
      html[data-sidebar-collapsed="true"] aside .sidebar-label {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
